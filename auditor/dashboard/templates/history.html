{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h2>Scan History</h2>
    <p class="subtitle">Browse and compare previous scans</p>
</div>

<div class="card">
    <div class="card-header">
        <h3>Scan History</h3>
        <div class="header-right">
            <select id="history-limit" class="select-sm">
                <option value="10">10</option>
                <option value="25" selected>25</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
        </div>
    </div>
    <div class="table-container">
        <table class="data-table" id="history-table">
            <thead>
                <tr>
                    <th>Scan ID</th>
                    <th>Source</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th>Findings</th>
                    <th>Content Hash</th>
                    <th>Time</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="history-body">
                <tr class="loading-row"><td colspan="8">Loading...</td></tr>
            </tbody>
        </table>
    </div>
    <div class="pagination" id="history-pagination"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/history.js"></script>
{% endblock %}
